services:
  api:
    build:
      context: ../..
      dockerfile: Deployment/docker/Dockerfile
    container_name: legends-api
    env_file:
      - ../config/dev.env.example
    ports:
      - "8000:8000"
    volumes:
      - api_data:/srv/backend/data
    restart: unless-stopped

  # Production DB (enable when moving past the prototype):
