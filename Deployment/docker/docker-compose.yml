# Usage (dev):  cp ../config/dev.env.example ../config/dev.env && docker compose up -d --build
# Usage (prod): docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  api:
    build:
      context: ../..
      dockerfile: Deployment/docker/Dockerfile
    container_name: legends-api
    env_file:
      - ../config/dev.env
    ports:
      - "8000:8000"
    volumes:
      - api_data:/srv/backend/data
    restart: unless-stopped

volumes:
  api_data:
