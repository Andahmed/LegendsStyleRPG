# Unity Cloud Build (Build Automation) — target configuration
# ============================================================
# HOW TO USE (also see Documentation/CloudBuild-AR.md):
#   Option A (recommended, no YAML needed): configure the target in the
#     cloud.unity.com dashboard exactly like the table in CloudBuild-AR.md.
#   Option B: apply this file through the Build Automation REST API:
#     POST /api/v1/orgs/{ORG_ID}/projects/{PROJECT_ID}/config
#     with this YAML as the cloudConfig body (or import it in the UI where
#     supported).
#
# HONESTY NOTE (read before debugging):
#   - These values were written to MATCH the repo (Unity 2022.3.55f1,
#     GameClient subfolder, BuildTools methods below) but the exact REST
#     schema field names have changed between Build Automation versions —
#     verify against the current docs the first time you import.
#   - Nothing here has been executed on Cloud Build yet. First failure is
#     almost always a compile error in the first 30 log lines.
#
# The methods referenced (must stay in sync with GameClient/Assets/Editor/BuildTools.cs):
#   PreExport    -> generates Boot.unity in batchmode, registers it in
#                   EditorBuildSettings, applies player settings
#                   (IL2CPP/ARM64/minSdk 23/targetSdk 34/com.legends.stylerpg).
#   BuildAndroid -> optional -executeMethod entry that builds
#                   Builds/Android/LegendsRPG-v1.2.0.apk and prints the
#                   failure reason into the log.

project:
  name: LegendsStyleRPG
  projectFolder: GameClient        # repo root is NOT the Unity project root
  scmType: GitHub
  defaultBranch: main

targets:
  android:
    platform: Android              # APK, ARM64-only via BuildTools
    unityVersion: 2022.3.55f1      # MUST equal GameClient/ProjectSettings/ProjectVersion.txt
    outputFormat: apk
    buildScripts:
      preExportMethod: LegendsRPG.EditorTools.BuildTools.PreExport
      buildMethod: LegendsRPG.EditorTools.BuildTools.BuildAndroid   # optional; leave empty to use EditorBuildSettings
    autoBuild: true                # build on every push to the tracked branch
    advancedOptions:
      androidBuildSystem: Gradle
      scriptingBackend: IL2CPP     # enforced again in BuildTools.ApplyAndroidPlayerSettings
      architectures: ARM64
      minSdk: 23
      targetSdk: 34
      applicationIdentifier: com.legends.stylerpg
