# Reference values for a manually configured Unity Build Automation target.
# This file is NOT an automatically applied Unity service configuration.
# Canonical Unity project: GameClient/
# Source of truth: GameClient/ProjectSettings/ProjectVersion.txt and
# GameClient/Assets/Editor/BuildTools.cs

project:
  name: LegendsStyleRPG
  projectFolder: GameClient
  scmType: GitHub
  repository: Andahmed/LegendsStyleRPG
  defaultBranch: main

target:
  name: android-apk
  platform: Android
  outputFormat: apk
  unityVersion: 2022.3.62f3
  preExportMethod: LegendsRPG.EditorTools.BuildTools.PreExport

  # BuildTools.BuildAndroid is the custom GitHub Actions/local BuildPipeline
  # entry point. For Unity Build Automation, use its normal build after the
  # pre-export hook unless a tested custom-build setup is intentionally required.

  playerSettings:
    applicationIdentifier: com.ahmed.legendsstylerpg
    scriptingBackend: IL2CPP
    architectures:
      - ARMv7
      - ARM64
    minimumAndroidApi: 23
    targetAndroidApi: 34
    orientation: Landscape
    bundleVersion: 1.2.0
    bundleVersionCode: 14

  expectedOutput:
    relativePath: Builds/Android/LegendsRPG-v1.2.0.apk
